name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          sw_vers

      - name: Build and package
        run: ./scripts/package-app.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 'MARKETING_VERSION = ' myleaf.xcodeproj/project.pbxproj \
            | sed -E 's/.*= ([^;]+);/\1/' | tr -d '[:space:]')"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$VERSION"
          fi
          echo "Publishing $TAG (version $VERSION)"
          gh release create "$TAG" \
            "dist/myleaf-$VERSION.pkg" \
            "dist/myleaf-uninstaller-$VERSION.pkg" \
            "dist/myleaf-uninstaller-keepdata-$VERSION.pkg" \
            "dist/myleaf-$VERSION.dmg" \
            "dist/myleaf-$VERSION.zip" \
            "dist/SHA256SUMS.txt" \
            --title "myleaf $VERSION" \
            --notes-file RELEASE_NOTES.md \
            --latest
